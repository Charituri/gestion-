.msg.warn{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink)}

main{min-width:0;display:grid;gap:16px;align-content:start}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.list{display:grid;gap:10px}

.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.detail{display:grid;gap:14px}

}

function navItems() {

function pendingCount() { return S.team.filter(p => p.role === "en_attente" && p.actif).length; }
function todoCount() {

  if (has("livreur") && !has("directeur","exploitation","reception")) return S.cmds.filter(c => c.statut === "En livraison").length;

function vShell() {

function pillCls(s) { return {"Reçue": "p-recue", "En préparation": "p-prep", "Prête": "p-pret", "En livraison": "p-liv", "Livrée": "p-ok", "Annulée": "p-bad"}[s] || "p-recue"; }

}
function filtered() {
  const f = S.filter || "cours";
  return S.cmds.filter(c => f === "all" ? true : f === "cours" ? ["Reçue","En préparation","Prête","En livraison"].includes(c.statut)

function fraisFor(poids) { if (poids <= 0) return null; const r = S.tarifs.find(x => Number(x.poids_max) >= poids); return r ? Number(r.frais) : null; }
function ncTotals() {
  const nc = S.nc; let prod = 0, poids = 0;
  nc.lines.forEach(l => { const p = S.produits.find(x => String(x.id) === String(l.pid)); if (!p) return; const q = num(l.qty), pr = l.prix === "" ? Number(p.prix_min || 0) : num(l.prix); prod += q * pr; if (p.unite === "kg") poids += q; });

  const ca = sum(liv), enc = sum(liv.filter(c => c.paye)), cred = sum(liv.filter(c => c.paiement_mode === "Crédit" && !c.paye)), nonenc = sum(liv.filter(c => !c.paye)) - cred;
  const buckets = [], today = new Date(todayK() + "T12:00:00");

  const byPay = {}; liv.filter(c => c.paye).forEach(c => byPay[c.paiement_mode] = (byPay[c.paiement_mode] || 0) + Number(c.total || 0));
  const byCli = {}; liv.forEach(c => byCli[c.client_nom] = (byCli[c.client_nom] || 0) + Number(c.total || 0));
  const cli = Object.keys(byCli).map(k => [k, byCli[k]]).sort((a, b) => b[1] - a[1]).slice(0, 8);

  const bySt = {}; (S.stockR || []).forEach(r => bySt[r.produit_id] = r);

}

const TONES = {cloche: "Cloche", sirene: "Sirène", klaxon: "Klaxon"};
function ring(kind) {
  kind = kind || (ls.get("chg_sound", {}).tone || "cloche");
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const T0 = actx.currentTime, note = (f, at, d, type, v) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, T0 + at); g.gain.exponentialRampToValueAtTime(v, T0 + at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, T0 + at + d); o.connect(g); g.connect(actx.destination); o.start(T0 + at); o.stop(T0 + at + d + 0.02); };
    if (kind === "sirene") { for (let i = 0; i < 4; i++) note(i % 2 ? 660 : 990, i * 0.3, 0.28, "triangle", 0.5); }
    else if (kind === "klaxon") { for (let i = 0; i < 3; i++) { note(440, i * 0.4, 0.3, "square", 0.25); note(554, i * 0.4, 0.3, "square", 0.2); } }
    else { [880, 1175, 880].forEach((f, i) => note(f, i * 0.22, 0.2, "sine", 0.45)); }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (_) {}
}
let alarmT = null, alarmStart = 0;
function startAlarm(txt) {
  ring(); alarmStart = Date.now(); clearInterval(alarmT);
  if (ls.get("chg_sound", {}).repeat !== false) alarmT = setInterval(() => { if (Date.now() - alarmStart > 300000) stopAlarm(); else ring(); }, 4000);
  let b = $("#alarm"); if (!b) { b = document.createElement("div"); b.id = "alarm"; b.className = "alarm"; document.body.appendChild(b); }
  b.innerHTML = `<span>🔔 ${e(txt)}</span><button class="btn sm" data-a="stopalarm">${t("Arrêter la sonnerie")}</button>`; b.hidden = false;
}
function stopAlarm() { clearInterval(alarmT); alarmT = null; const b = $("#alarm"); if (b) b.hidden = true; }
document.addEventListener("click", () => { if (alarmT && Date.now() - alarmStart > 700) stopAlarm(); }, true);
let wl = null;
async function keepAwake() { try { if (ls.get("chg_wake", false) && navigator.wakeLock && !document.hidden && !wl) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => wl = null); } } catch (_) {} }
function releaseAwake() { try { if (wl) wl.release(); } catch (_) {} wl = null; }

function setPath(path, val) {
  const k = path.split("."); let o = S, i = 0;
  if (k[0] === "te") { const id = k[1]; const x = teamEdit(S.team.find(p => p.id === id)); x[k[2]] = val; if (k[2] === "role") x.extra = x.extra.filter(r => r !== val); return; }
  for (; i < k.length - 1; i++) o = (o[k[i]] = o[k[i]] || {});
  o[k[k.length - 1]] = val;
}

    case "addline": S.nc.lines.push({pid: "", qty: "", prix: ""}); render(); break;
    case "rmline": S.nc.lines.splice(+d.i, 1); render(); break;
    case "pickc": { const c = S.clients.find(x => x.id === +d.id); S.nc.clientId = c.id; S.nc.clientNom = c.nom; if (!S.nc.adresse) S.nc.adresse = c.adresse || c.quartier || ""; render(); break; }
    case "create": createOrder(); break;
    case "tx": { const x = S.te[d.id]; const i = x.extra.indexOf(d.r); if (i >= 0) x.extra.splice(i, 1); else x.extra.push(d.r); render(); break; }
    case "tsave": teamSave(d.id, d.on === "1"); break;
    case "toff": teamOff(d.id); break;
    case "treset": { const p = S.team.find(q => q.id === d.id); try { await sendReset(p.email); toast(t("Lien envoyé à") + " " + p.email, 5000); } catch (er) { toast(er.message, 5000); } break; }
    case "showcode": try { S.code = await rpc("voir_code_inscription"); } catch (er) { toast(er.message); } render(); break;
    case "setcode": try { await rpc("changer_code_inscription", {p_code: S.newCode || ""}); S.code = await rpc("voir_code_inscription"); S.newCode = ""; toast(t("Code changé")); } catch (er) { toast(er.message, 5000); } render(); break;
    case "setpw": try { if ((S.newPw || "").length < 6) return toast(t("6 caractères minimum.")); await api("/auth/v1/user", {method: "PUT", body: {password: S.newPw}}); S.newPw = ""; toast(t("Mot de passe changé")); render(); } catch (er) { toast(er.message, 5000); } break;
    case "theme": ls.set("chg_theme", d.k); applyTheme(); render(); break;
    case "install": if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; render(); } break;
  }
});

/* ================= Démarrage ================= */
window.addEventListener("online", () => { S.online = true; flushQueue(); softRender(); });
window.addEventListener("offline", () => { S.online = false; softRender(); });
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); S.installEvt = ev; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
async function poll() {
  if (!S.sess || !isActive() && !(S.prof && S.prof.role === "en_attente")) return;
  try {
    await flushQueue();
    if (S.prof && S.prof.role === "en_attente") { await loadProfile(); if (isActive()) { await loadAll(); } render(); return; }
    if (canSeeCmd()) await loadCmd();
    if (has("directeur")) await loadTeam();
    softRender();
  } catch (_) {}
}
setInterval(() => { if (!document.hidden) poll(); }, 10000);

(async function init() {
  applyTheme(); keepAwake();
  const h = location.hash.replace(/^#/, "");
  if (h) {
    const q = new URLSearchParams(h);
    if (q.get("access_token") && q.get("type") === "recovery") {
      S.recovery = {access_token: q.get("access_token"), refresh_token: q.get("refresh_token"), expires_in: +q.get("expires_in") || 3600};
      render(); return;
    }
    if (q.get("error_description")) { S.authMsg = {k: "err", t: "Ce lien n'est plus valable. Demandez-en un nouveau (« Mot de passe oublié ? »)."}; history.replaceState(null, "", location.pathname); }
  }
  if (S.sess) {
    try { await boot(); await flushQueue(); }
    catch (er) {
      if (er instanceof NetErr) { S.authMsg = {k: "err", t: "Pas de connexion. Réessayez quand le réseau revient."}; S.sess = S.sess; }
      else { S.sess = null; ls.del("chg_sess"); }
      render();
    }
  } else render();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
