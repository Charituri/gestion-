<script>
"use strict";

/* ================= Client Supabase minimal ================= */
class NetErr extends Error {}
async function raw(path, o) {
  o = o || {};

  const tok = o.token === undefined ? (S.sess && S.sess.access_token) : o.token;

  let d = null; const txt = await r.text(); if (txt) { try { d = JSON.parse(txt); } catch (_) { d = txt; } }
  if (!r.ok) {

function msgErr(d, st) {
  const m = String((d && (d.msg || d.error_description || d.message || d.error)) || d || "Erreur " + st);
  if (/Invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";

  if (/rate limit|too many/i.test(m)) return "Trop d'essais. Patientez une minute puis réessayez.";

  if (has("directeur","exploitation","reception")) {
    jobs.push(rest("produits?actif=eq.true&select=*&order=categorie,ordre,nom").then(r => S.produits = r).catch(() => {}));
    jobs.push(rest("clients?select=id,nom,telephone,whatsapp,quartier,adresse&order=nom&limit=2000").then(r => S.clients = r).catch(() => {}));
    jobs.push(rest("livraison_tarifs?select=*&order=poids_max").then(r => S.tarifs = r).catch(() => {}));
    jobs.push(rpc("liste_livreurs").then(r => S.livreurs = r).catch(() => {}));
  }
  jobs.push(rest("parametres?select=*").then(r => { S.params = {}; (r || []).forEach(p => S.params[p.cle] = p.valeur); }).catch(() => {}));
  if (has("directeur")) jobs.push(loadTeam());
  await Promise.all(jobs);
}

/* ================= Alertes ================= */
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    [880, 1175, 880].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * 0.22); g.gain.exponentialRampToValueAtTime(0.35, actx.currentTime + i * 0.22 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * 0.22 + 0.2);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + i * 0.22); o.stop(actx.currentTime + i * 0.22 + 0.22);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (_) {}
}
function detectNew(list) {
  const ids = {}; list.forEach(c => ids[c.id] = c.statut);
  if (S.seen) {
    const nw = list.filter(c => !(c.id in S.seen));
    const ch = list.filter(c => c.id in S.seen && S.seen[c.id] !== c.statut && c.statut === "En livraison" && has("livreur") && c.livreur_id === S.prof.id);
    const watchRecv = has("directeur","exploitation","reception","boucher");
    const a = nw.filter(c => (c.statut === "Reçue" && watchRecv) || (c.statut === "En livraison" && has("livreur")));
    if (a.length || ch.length) {
      beep();
      const x = a[0] || ch[0];
      toast((x.statut === "En livraison" ? "Nouvelle livraison" : "Nouvelle commande") + " #" + x.id + " · " + x.client_nom + (a.length + ch.length > 1 ? " (+" + (a.length + ch.length - 1) + ")" : ""), 6000);
    }
  }
  S.seen = ids;
}

/* ================= File d'attente hors ligne ================= */
function qSave() { ls.set("chg_q", S.queue); }
async function flushQueue() {
  if (!S.queue.length || !S.sess) return;
  let changed = false;
  while (S.queue.length) {
    const it = S.queue[0];
    try { await rpc(it.rpc, it.args); S.queue.shift(); changed = true; }
    catch (er) {
      if (er instanceof NetErr) break;
      S.queue.shift(); changed = true; toast("Action #" + it.id + " refusée : " + er.message, 6000);
    }
  }
  qSave();
  if (changed) { try { await loadCmd(); } catch (_) {} softRender(); }
}
async function act(rpcName, args, id, patch) {
  try { await rpc(rpcName, args); toast("Enregistré"); await loadCmd(); }
  catch (er) {
    if (er instanceof NetErr) {
      S.queue.push({rpc: rpcName, args, id}); qSave();
      const c = S.cmds.find(x => x.id === id); if (c && patch) Object.assign(c, patch);
      toast("Hors ligne : enregistré, sera envoyé dès le retour du réseau.", 5000);
    } else { toast(er.message, 5000); }
  }
  S.cancelAsk = false; render();
}

  try { S.lignes[id] = await rest("v_lignes?commande_id=eq." + id + "&select=*"); } catch (_) { S.lignes[id] = S.lignes[id] || []; }
  if (S.detail === id) render();
}

/* ----- nouvelle commande ----- */
function newNC() { return {clientId: null, clientNom: "", adresse: "", paiement: "Cash", remarques: "", lines: [{pid: "", qty: "", prix: ""}]}; }
function fraisFor(poids) { if (poids <= 0) return null; const r = S.tarifs.find(x => Number(x.poids_max) >= poids); return r ? Number(r.frais) : null; }
function ncTotals() {
  const nc = S.nc; let prod = 0, poids = 0;
  nc.lines.forEach(l => { const p = S.produits.find(x => String(x.id) === String(l.pid)); if (!p) return; const q = num(l.qty), pr = l.prix === "" ? Number(p.prix_min || 0) : num(l.prix); prod += q * pr; if (p.unite === "kg") poids += q; });
  return {prod, poids, frais: fraisFor(poids)};
}
function totalsHTML() {
  const T = ncTotals();
  return `<div><span>${t("Produits")}</span><span class="num">${fc(T.prod)}</span></div>
  <div><span>${t("Livraison")}${T.poids > 0 ? " (" + T.poids.toLocaleString("fr-FR") + " kg)" : ""}</span><span class="num">${T.frais == null ? t("à confirmer") : fc(T.frais)}</span></div>
  <div class="t"><span>${t("Total")}</span><span class="num">${fc(T.prod + (T.frais || 0))}</span></div>`;
}
function prodOptions(sel) {
  const g = {}; S.produits.forEach(p => (g[p.categorie || "Autres"] = g[p.categorie || "Autres"] || []).push(p));
  return `<option value="">${t("— Produit —")}</option>` + Object.keys(g).map(k => `<optgroup label="${e(k)}">${g[k].map(p => `<option value="${p.id}" ${String(sel) === String(p.id) ? "selected" : ""}>${e(p.nom)} (${e(p.unite)}) — ${p.prix_min == null ? "?" : Math.round(p.prix_min).toLocaleString("fr-FR")}${p.prix_max && p.prix_max !== p.prix_min ? "–" + Math.round(p.prix_max).toLocaleString("fr-FR") : ""}</option>`).join("")}</optgroup>`).join("");
}
function suggHTML() {
  const q = S.nc.clientNom.trim().toLowerCase();
  if (S.nc.clientId || q.length < 2) return "";
  const m = S.clients.filter(c => c.nom.toLowerCase().includes(q) || (c.telephone || "").includes(q)).slice(0, 6);
  return m.map(c => `<button type="button" data-a="pickc" data-id="${c.id}">${e(c.nom)}<small>${e([c.telephone, c.quartier].filter(Boolean).join(" · "))}</small></button>`).join("")
    + (m.find(c => c.nom.toLowerCase() === q) ? "" : `<div class="msg">${t("Nouveau client : il sera créé avec cette commande.")}</div>`);
}

async function createOrder() {
  const nc = S.nc;
  if (!nc.clientNom.trim()) return toast(t("Indiquez le client."));
  const lignes = nc.lines.filter(l => l.pid && num(l.qty) > 0).map(l => { const o = {produit_id: Number(l.pid), quantite: num(l.qty)}; if (l.prix !== "") o.prix = num(l.prix); return o; });
  if (!lignes.length) return toast(t("Ajoutez au moins un produit avec sa quantité."));
  S.busy = true; render();
  try {
    const id = await rpc("creer_commande", {p_client_id: nc.clientId, p_client_nom: nc.clientNom.trim(), p_adresse: nc.adresse, p_paiement_prevu: nc.paiement, p_remarques: nc.remarques, p_lignes: lignes});
    S.nc = newNC(); S.busy = false;
    await loadCmd(); rest("clients?select=id,nom,telephone,whatsapp,quartier,adresse&order=nom&limit=2000").then(r => S.clients = r).catch(() => {});
    S.tab = "cmd"; toast(t("Commande") + " #" + id + " " + t("enregistrée")); await openDetail(id);
  } catch (er) { S.busy = false; toast(er instanceof NetErr ? t("Pas de réseau : la commande n'a pas été enregistrée. Réessayez.") : er.message, 6000); render(); }
}

async function teamSave(id, on) {
  const x = S.te[id], p = S.team.find(q => q.id === id);
  if (!x.role) return toast(t("Choisissez d'abord le poste principal."));
  const body = {role: x.role, roles_extra: x.extra.filter(r => r !== x.role)};
  if (on) body.actif = true;
  try { await rest("profiles?id=eq." + id, {method: "PATCH", body, headers: {Prefer: "return=minimal"}}); delete S.te[id]; await loadTeam(); toast(t("Enregistré")); }
  catch (er) { toast(er.message, 5000); }
  render();
}
async function teamOff(id) {
  if (S.offAsk !== id) { S.offAsk = id; return render(); }
  S.offAsk = null;
  try { await rest("profiles?id=eq." + id, {method: "PATCH", body: {actif: false}, headers: {Prefer: "return=minimal"}}); delete S.te[id]; await loadTeam(); toast(t("Compte désactivé")); }
  catch (er) { toast(er.message, 5000); }
  render();
}
async function sendReset(email) {
  return raw("/auth/v1/recover?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {method: "POST", token: null, body: {email}});
}

/* ================= Événements ================= */
function setPath(path, val) {
  const k = path.split("."); let o = S, i = 0;
  if (k[0] === "te") { const id = k[1]; const x = teamEdit(S.team.find(p => p.id === id)); x[k[2]] = val; if (k[2] === "role") x.extra = x.extra.filter(r => r !== val); return; }
  for (; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
document.addEventListener("input", ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.m) return;
  if (el.tagName === "SELECT") return;
  setPath(el.dataset.m, el.value);
  if (el.dataset.m === "nc.clientNom") { S.nc.clientId = null; $("#sugg").innerHTML = suggHTML(); }
  if (/^nc\.lines\./.test(el.dataset.m)) $("#tot").innerHTML = totalsHTML();
});
document.addEventListener("change", ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.m || el.tagName !== "SELECT") return;
  const m = el.dataset.m;
  setPath(m, el.value);
  const mm = m.match(/^nc\.lines\.(\d+)\.pid$/);
  if (mm) { S.nc.lines[+mm[1]].prix = ""; render(); }
  else if (/^te\./.test(m)) render();
  else if (/^nc\.lines\./.test(m)) $("#tot").innerHTML = totalsHTML();
});
document.addEventListener("submit", async ev => {
  const f = ev.target.dataset.f; if (!f) return;
  ev.preventDefault();
  const g = id => { const x = ev.target.querySelector("#" + id); return x ? x.value.trim() : ""; };
  S.busy = true; S.authMsg = null;
  try {
    if (f === "login") { await signIn(g("em"), ev.target.querySelector("#pw").value); }
    else if (f === "signup") {
      const done = await signUp(g("nm"), g("em"), ev.target.querySelector("#pw").value, g("cd").toUpperCase());
      if (!done) { S.authView = "login"; S.authMsg = {k: "ok", t: "Compte créé. Vous pouvez vous connecter."}; }
    } else if (f === "forgot") { await sendReset(g("em")); S.authView = "login"; S.authMsg = {k: "ok", t: "Si cette adresse existe, un lien vient d'être envoyé. Vérifiez votre boîte e-mail (et les courriers indésirables)."}; }
    else if (f === "recovery") {
      const pw = ev.target.querySelector("#pw").value;
      await raw("/auth/v1/user", {method: "PUT", token: S.recovery.access_token, body: {password: pw}});
      setSess(S.recovery); S.recovery = null; history.replaceState(null, "", location.pathname); S.busy = false; await boot(); toast(t("Mot de passe changé")); return;
    }
  } catch (er) { S.authMsg = {k: "err", t: er instanceof NetErr ? "Pas de connexion internet." : er.message}; }
  S.busy = false; render();
});
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, d = b.dataset;
  if (actx && actx.state === "suspended") actx.resume();
  switch (a) {
    case "auth": S.authView = d.v; S.authMsg = null; render(); break;
    case "logout": signOut(); break;
    case "recheck": try { await loadProfile(); if (isActive()) await loadAll(); } catch (er) { toast(er.message); } render(); break;
    case "tab": S.tab = d.k; S.detail = null; S.cancelAsk = false; if (d.k === "team") loadTeam().then(softRender).catch(() => {}); render(); window.scrollTo(0, 0); break;
    case "filt": S.filter = d.k; render(); break;
    case "open": openDetail(+d.id); break;
    case "back": S.detail = null; render(); break;
    case "cancelask": S.cancelAsk = true; render(); break;
    case "st": {
      const id = S.detail; let liv = null;
      if (d.s === "En livraison") { liv = S.pickLiv; if (!liv) return toast(t("Choisissez un livreur.")); }
      const patch = {statut: d.s}; if (liv) { patch.livreur_id = liv; const l = S.livreurs.find(x => x.id === liv); patch.livreur_nom = l && l.nom; }
      await act("changer_statut", {p_id: id, p_statut: d.s, p_livreur: liv}, id, patch); break;
    }
    case "enc": { const id = S.detail; await act("encaisser", {p_id: id, p_mode: d.m}, id, {paye: d.m !== "Crédit", paiement_mode: d.m}); break; }
    case "frais": { const v = num(S.fraisIn); if (S.fraisIn === "" || v < 0) return toast(t("Indiquez un montant.")); try { await rpc("fixer_frais", {p_id: S.detail, p_frais: v}); await loadCmd(); S.fraisIn = ""; toast(t("Enregistré")); } catch (er) { toast(er.message, 5000); } render(); break; }
    case "print": document.body.classList.remove("pfmode"); printTicket(); break;
    case "pf": printPF(); break;
    case "addline": S.nc.lines.push({pid: "", qty: "", prix: ""}); render(); break;
    case "rmline": S.nc.lines.splice(+d.i, 1); render(); break;
    case "pickc": { const c = S.clients.find(x => x.id === +d.id); S.nc.clientId = c.id; S.nc.clientNom = c.nom; if (!S.nc.adresse) S.nc.adresse = c.adresse || c.quartier || ""; render(); break; }
    case "create": createOrder(); break;
    case "tx": { const x = S.te[d.id]; const i = x.extra.indexOf(d.r); if (i >= 0) x.extra.splice(i, 1); else x.extra.push(d.r); render(); break; }
    case "tsave": teamSave(d.id, d.on === "1"); break;
    case "toff": teamOff(d.id); break;
    case "treset": { const p = S.team.find(q => q.id === d.id); try { await sendReset(p.email); toast(t("Lien envoyé à") + " " + p.email, 5000); } catch (er) { toast(er.message, 5000); } break; }
    case "showcode": try { S.code = await rpc("voir_code_inscription"); } catch (er) { toast(er.message); } render(); break;
    case "setcode": try { await rpc("changer_code_inscription", {p_code: S.newCode || ""}); S.code = await rpc("voir_code_inscription"); S.newCode = ""; toast(t("Code changé")); } catch (er) { toast(er.message, 5000); } render(); break;
    case "setpw": try { if ((S.newPw || "").length < 6) return toast(t("6 caractères minimum.")); await api("/auth/v1/user", {method: "PUT", body: {password: S.newPw}}); S.newPw = ""; toast(t("Mot de passe changé")); render(); } catch (er) { toast(er.message, 5000); } break;
    case "theme": ls.set("chg_theme", d.k); applyTheme(); render(); break;
    case "install": if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; render(); } break;
  }
});

/* ================= Démarrage ================= */
window.addEventListener("online", () => { S.online = true; flushQueue(); softRender(); });
window.addEventListener("offline", () => { S.online = false; softRender(); });
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); S.installEvt = ev; });
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
async function poll() {
  if (!S.sess || !isActive() && !(S.prof && S.prof.role === "en_attente")) return;
  try {
    await flushQueue();
    if (S.prof && S.prof.role === "en_attente") { await loadProfile(); if (isActive()) { await loadAll(); } render(); return; }
    if (canSeeCmd()) await loadCmd();
    if (has("directeur")) await loadTeam();
    softRender();
  } catch (_) {}
}
setInterval(() => { if (!document.hidden) poll(); }, 20000);

(async function init() {
  applyTheme();
  const h = location.hash.replace(/^#/, "");
  if (h) {
    const q = new URLSearchParams(h);
    if (q.get("access_token") && q.get("type") === "recovery") {
      S.recovery = {access_token: q.get("access_token"), refresh_token: q.get("refresh_token"), expires_in: +q.get("expires_in") || 3600};
      render(); return;
    }
    if (q.get("error_description")) { S.authMsg = {k: "err", t: "Ce lien n'est plus valable. Demandez-en un nouveau (« Mot de passe oublié ? »)."}; history.replaceState(null, "", location.pathname); }
  }
  if (S.sess) {
    try { await boot(); await flushQueue(); }
    catch (er) {
      if (er instanceof NetErr) { S.authMsg = {k: "err", t: "Pas de connexion. Réessayez quand le réseau revient."}; S.sess = S.sess; }
      else { S.sess = null; ls.del("chg_sess"); }
      render();
    }
  } else render();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
